[project]
name = "college-ai-chatbot-backend"
version = "0.1.0"
description = "Backend API for the College AI Chatbot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.141.1",
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "boto3>=1.38.0",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
    "email-validator>=2.3.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openai>=1.0.0",
]

[project.scripts]
start = "app.main:start"
